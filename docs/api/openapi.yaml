openapi: 3.1.0
info:
  title: Partner Commerce API
  version: 1.0.0-draft
  summary: Sell Mr UK and Skywood products from partner apps (banks, wallets, super-apps).
  description: |
    Draft contract for v1. See docs/api/PARTNER-API.md (design) and
    docs/security/PARTNER-API-SECURITY.md (authentication, signing, threat model).

    Conventions:
    - All amounts are integer TZS with `currency: TZS`.
    - Every POST requires an `Idempotency-Key` header.
    - Payment, refund and remittance confirmations require `X-Hub-Signature:
      t=<unix>,v1=<hex HMAC-SHA256(signingSecret, t + "." + rawBody)>`, accepted within 5 minutes.
    - Errors use RFC 7807 `application/problem+json`.
    - One merchant (`mruk` or `skywood`) per quote, order and settlement.
servers:
  - url: https://sandbox.partners.{hubDomain}/api/partner/v1
    description: Sandbox (no money or real stock moves)
    variables:
      hubDomain:
        default: hub-domain.example
        description: To be agreed with the client
  - url: https://partners.{hubDomain}/api/partner/v1
    description: Live
    variables:
      hubDomain:
        default: hub-domain.example
        description: To be agreed with the client
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: Catalogue
  - name: Quotes
  - name: Orders
  - name: Payments
  - name: Refunds
  - name: Settlements
  - name: Events
  - name: Webhooks
  - name: Sandbox

paths:
  /oauth/token:
    post:
      tags: [Auth]
      operationId: createToken
      summary: Issue an access token (OAuth 2.0 client credentials)
      description: Client authenticates with HTTP Basic (client_id:client_secret) and, in live, optionally mTLS. Idempotency-Key is not required on this endpoint.
      security:
        - clientBasic: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type]
              properties:
                grant_type:
                  type: string
                  const: client_credentials
                scope:
                  type: string
                  description: Space-separated subset of the credential's scopes.
                  example: catalog:read orders:write payments:write
      responses:
        '200':
          description: Token issued
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Token' }
              example:
                access_token: eyJhbGciOiJFUzI1NiIsImtpZCI6InBrMSJ9.eyJzdWIiOiJwYXJ0bmVyX2F6YW5pYSJ9.sig
                token_type: Bearer
                expires_in: 600
                scope: catalog:read orders:write payments:write
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /merchants:
    get:
      tags: [Catalogue]
      operationId: listMerchants
      summary: Merchants this partner is granted
      x-scopes: [catalog:read]
      responses:
        '200':
          description: Granted merchants
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Merchant' }
              example:
                data:
                  - key: skywood
                    name: Skywood
                    legalName: Skywood (legal name per Brand record)
                    modes: [api, mini_store]
                    rails: [bank_account]
                    holdMinutes: 30
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }

  /merchants/{merchant}/categories:
    get:
      tags: [Catalogue]
      operationId: listCategories
      summary: Categories and subcategories
      x-scopes: [catalog:read]
      parameters:
        - $ref: '#/components/parameters/Merchant'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Categories
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Category' }
        '304': { description: Not modified }
        '404': { $ref: '#/components/responses/Problem' }

  /merchants/{merchant}/products:
    get:
      tags: [Catalogue]
      operationId: listProducts
      summary: Product list (indicative price and availability)
      x-scopes: [catalog:read]
      parameters:
        - $ref: '#/components/parameters/Merchant'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/IfNoneMatch'
        - { name: category, in: query, schema: { type: string } }
        - { name: sub, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: inStock, in: query, schema: { type: boolean } }
        - name: updatedSince
          in: query
          description: Incremental sync. Includes products hidden since then, with available=false.
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Page of products
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control:
              schema: { type: string, example: 'private, max-age=60' }
          content:
            application/json:
              schema:
                type: object
                required: [data, nextCursor]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Product' }
                  nextCursor: { $ref: '#/components/schemas/NextCursor' }
        '304': { description: Not modified }
        '404': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /merchants/{merchant}/products/{productId}:
    get:
      tags: [Catalogue]
      operationId: getProduct
      summary: Product detail
      x-scopes: [catalog:read]
      parameters:
        - $ref: '#/components/parameters/Merchant'
        - { name: productId, in: path, required: true, schema: { type: string, maxLength: 80 } }
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Product
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '304': { description: Not modified }
        '404': { $ref: '#/components/responses/Problem' }

  /merchants/{merchant}/delivery-regions:
    get:
      tags: [Catalogue]
      operationId: listDeliveryRegions
      summary: Delivery regions, indicative fee and ETA
      x-scopes: [catalog:read]
      parameters:
        - $ref: '#/components/parameters/Merchant'
      responses:
        '200':
          description: Regions
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/DeliveryRegion' }

  /quotes:
    post:
      tags: [Quotes]
      operationId: createQuote
      summary: Price a cart for one merchant
      description: Returns a stored, single-use quote valid about 15 minutes. Only a quote is binding on price.
      x-scopes: [orders:write]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuoteRequest' }
            example:
              merchant: skywood
              region: Dar es Salaam
              lines:
                - { productId: sw-sofa-3s-oslo, qty: 1 }
      responses:
        '201':
          description: Quote
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Quote' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /orders:
    post:
      tags: [Orders]
      operationId: createOrder
      summary: Create an order from a quote (holds stock)
      x-scopes: [orders:write]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderCreate' }
            example:
              quoteId: qt_8Hk2mP
              partnerOrderRef: AZ-ORD-000123
              partnerCustomerRef: CUST-88812
              contact:
                name: Asha Mushi
                phone: '+255712345678'
                email: ''
              delivery:
                region: Dar es Salaam
                addressLine: Plot 12, Msasani Peninsula
              consentAt: '2026-11-27T09:29:40Z'
      responses:
        '201':
          description: Order created, pending payment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '410': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    get:
      tags: [Orders]
      operationId: listOrders
      summary: List this partner's orders
      x-scopes: [orders:read]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - { name: merchant, in: query, schema: { $ref: '#/components/schemas/MerchantKey' } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/OrderStatus' } }
        - { name: updatedSince, in: query, schema: { type: string, format: date-time } }
        - { name: partnerOrderRef, in: query, schema: { type: string, maxLength: 64 } }
      responses:
        '200':
          description: Page of orders
          content:
            application/json:
              schema:
                type: object
                required: [data, nextCursor]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Order' }
                  nextCursor: { $ref: '#/components/schemas/NextCursor' }

  /orders/{orderId}:
    get:
      tags: [Orders]
      operationId: getOrder
      summary: Order detail
      x-scopes: [orders:read]
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '404': { $ref: '#/components/responses/Problem' }

  /orders/{orderId}/cancel:
    post:
      tags: [Orders]
      operationId: cancelOrder
      summary: Cancel an unpaid order, or request cancellation of a paid one
      x-scopes: [orders:write]
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              additionalProperties: false
              properties:
                reason: { type: string, minLength: 3, maxLength: 300 }
      responses:
        '200':
          description: Cancelled (was pending_payment)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '202':
          description: Cancellation requested; Finance decides
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '409': { $ref: '#/components/responses/Problem' }

  /orders/{orderId}/payments:
    post:
      tags: [Payments]
      operationId: confirmPayment
      summary: Confirm payment collected by the partner (signed)
      description: Amount must equal amountDue and the order must be pending_payment with holdExpiresAt in the future.
      x-scopes: [payments:write]
      x-signed: true
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/HubSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentConfirmation' }
            example:
              amount: 1450000
              currency: TZS
              partnerTransactionRef: AZ-TXN-9F31C2
              rail: bank_account
              paidAt: '2026-11-27T09:31:00Z'
      responses:
        '201':
          description: Payment captured; order is paid
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
        '200':
          description: Same partnerTransactionRef already captured (returns existing payment)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /orders/{orderId}/invoice:
    get:
      tags: [Orders]
      operationId: getInvoice
      summary: Merchant invoice PDF
      x-scopes: [orders:read]
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: PDF
          content:
            application/pdf:
              schema: { type: string, contentMediaType: application/pdf }
        '404': { $ref: '#/components/responses/Problem' }

  /refunds:
    get:
      tags: [Refunds]
      operationId: listRefunds
      x-scopes: [orders:read]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - { name: status, in: query, schema: { $ref: '#/components/schemas/RefundStatus' } }
        - { name: merchant, in: query, schema: { $ref: '#/components/schemas/MerchantKey' } }
      responses:
        '200':
          description: Page of refunds
          content:
            application/json:
              schema:
                type: object
                required: [data, nextCursor]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Refund' }
                  nextCursor: { $ref: '#/components/schemas/NextCursor' }

  /refunds/{refundId}:
    get:
      tags: [Refunds]
      operationId: getRefund
      x-scopes: [orders:read]
      parameters:
        - $ref: '#/components/parameters/RefundId'
      responses:
        '200':
          description: Refund
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Refund' }
        '404': { $ref: '#/components/responses/Problem' }

  /refunds/{refundId}/confirm:
    post:
      tags: [Refunds]
      operationId: confirmRefund
      summary: Confirm money returned to the customer (signed)
      x-scopes: [refunds:write]
      x-signed: true
      parameters:
        - $ref: '#/components/parameters/RefundId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/HubSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefundConfirmation' }
            example:
              outcome: confirmed
              amount: 1450000
              currency: TZS
              partnerRefundRef: AZ-RFD-00042
              refundedAt: '2026-11-28T08:00:00Z'
      responses:
        '200':
          description: Refund updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Refund' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /settlements:
    get:
      tags: [Settlements]
      operationId: listSettlements
      x-scopes: [settlements:read]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - { name: merchant, in: query, schema: { $ref: '#/components/schemas/MerchantKey' } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/SettlementStatus' } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: Page of settlements
          content:
            application/json:
              schema:
                type: object
                required: [data, nextCursor]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Settlement' }
                  nextCursor: { $ref: '#/components/schemas/NextCursor' }

  /settlements/{settlementId}:
    get:
      tags: [Settlements]
      operationId: getSettlement
      x-scopes: [settlements:read]
      parameters:
        - $ref: '#/components/parameters/SettlementId'
      responses:
        '200':
          description: Settlement
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Settlement' }
        '404': { $ref: '#/components/responses/Problem' }

  /settlements/{settlementId}/lines:
    get:
      tags: [Settlements]
      operationId: listSettlementLines
      x-scopes: [settlements:read]
      parameters:
        - $ref: '#/components/parameters/SettlementId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Lines (JSON page, or full CSV with Accept text/csv)
          content:
            application/json:
              schema:
                type: object
                required: [data, nextCursor]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/SettlementLine' }
                  nextCursor: { $ref: '#/components/schemas/NextCursor' }
            text/csv:
              schema: { type: string }
              example: |
                kind,orderNumber,reference,amount,currency,at
                payment,SW-20391,AZ-TXN-9F31C2,1450000,TZS,2026-11-27T09:31:00Z

  /settlements/{settlementId}/remittance:
    post:
      tags: [Settlements]
      operationId: reportRemittance
      summary: Report the bank transfer made to the merchant (signed)
      x-scopes: [payments:write]
      x-signed: true
      parameters:
        - $ref: '#/components/parameters/SettlementId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/HubSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Remittance' }
      responses:
        '200':
          description: Settlement marked remitted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Settlement' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /events:
    get:
      tags: [Events]
      operationId: listEvents
      summary: Event feed for catch-up (last 30 days, same payloads as webhooks)
      x-scopes: [orders:read]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - { name: type, in: query, schema: { $ref: '#/components/schemas/EventType' } }
      responses:
        '200':
          description: Page of events, oldest first
          content:
            application/json:
              schema:
                type: object
                required: [data, nextCursor]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Event' }
                  nextCursor: { $ref: '#/components/schemas/NextCursor' }

  /webhook-endpoints:
    get:
      tags: [Webhooks]
      operationId: listWebhookEndpoints
      x-scopes: [webhooks:manage]
      responses:
        '200':
          description: Endpoints
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/WebhookEndpoint' }
    post:
      tags: [Webhooks]
      operationId: createWebhookEndpoint
      x-scopes: [webhooks:manage]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookEndpointInput' }
            example:
              url: https://api.partner.example/hub/webhooks
              events: [order.paid, order.dispatched, order.delivered, order.cancelled, order.expired, refund.created]
      responses:
        '201':
          description: Created. Deliveries are signed with the partner's signing secret.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookEndpoint' }
        '422': { $ref: '#/components/responses/Problem' }

  /webhook-endpoints/{endpointId}:
    parameters:
      - { name: endpointId, in: path, required: true, schema: { type: string } }
    patch:
      tags: [Webhooks]
      operationId: updateWebhookEndpoint
      x-scopes: [webhooks:manage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                url: { type: string, format: uri, pattern: '^https://' }
                events:
                  type: array
                  items: { $ref: '#/components/schemas/EventType' }
                status: { type: string, enum: [active, disabled] }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookEndpoint' }
    delete:
      tags: [Webhooks]
      operationId: deleteWebhookEndpoint
      x-scopes: [webhooks:manage]
      responses:
        '204': { description: Deleted }

  /webhook-endpoints/{endpointId}/test:
    post:
      tags: [Webhooks]
      operationId: testWebhookEndpoint
      summary: Send a ping event
      x-scopes: [webhooks:manage]
      parameters:
        - { name: endpointId, in: path, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookDelivery' }

  /webhook-deliveries:
    get:
      tags: [Webhooks]
      operationId: listWebhookDeliveries
      x-scopes: [webhooks:manage]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - { name: endpointId, in: query, schema: { type: string } }
        - { name: failed, in: query, schema: { type: boolean } }
      responses:
        '200':
          description: Delivery log
          content:
            application/json:
              schema:
                type: object
                required: [data, nextCursor]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/WebhookDelivery' }
                  nextCursor: { $ref: '#/components/schemas/NextCursor' }

  /webhook-deliveries/{deliveryId}/redeliver:
    post:
      tags: [Webhooks]
      operationId: redeliverWebhook
      x-scopes: [webhooks:manage]
      parameters:
        - { name: deliveryId, in: path, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookDelivery' }

  /sandbox/orders/{orderId}/simulate:
    post:
      tags: [Sandbox]
      operationId: simulateOrder
      summary: Sandbox only. Drive fulfilment or failure events. Returns 404 in live.
      x-scopes: [orders:write]
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              additionalProperties: false
              properties:
                action: { type: string, enum: [pack, dispatch, deliver, cancel, expire, approve_cancellation, close_settlement] }
      responses:
        '200':
          description: Order after simulation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '404': { $ref: '#/components/responses/Problem' }

webhooks:
  orderEvent:
    post:
      summary: Order lifecycle events
      description: Signed with the partner's signing secret. Retried with backoff up to 24 h, then dead-lettered. Types order.created, order.paid, order.packed, order.dispatched, order.delivered, order.cancellation_requested, order.cancelled, order.expired. At least once, unordered; dedupe by id, use data.order.version.
      parameters:
        - $ref: '#/components/parameters/HubSignature'
        - { name: X-Hub-Event, in: header, required: true, schema: { $ref: '#/components/schemas/EventType' } }
        - { name: X-Hub-Delivery, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Event' }
            example:
              id: evt_01JDX4Q8K2
              type: order.paid
              createdAt: '2026-11-27T09:31:02Z'
              merchant: skywood
              data:
                order: { id: ord_7Qx2, number: SW-20391, status: paid, version: 3, partnerOrderRef: AZ-ORD-000123 }
      responses:
        '200': { description: Acknowledged (any 2xx within 5 s) }
  refundEvent:
    post:
      summary: Refund events (refund.created, refund.confirmed, refund.failed)
      parameters:
        - $ref: '#/components/parameters/HubSignature'
        - { name: X-Hub-Event, in: header, required: true, schema: { $ref: '#/components/schemas/EventType' } }
        - { name: X-Hub-Delivery, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Event' }
            example:
              id: evt_01JDX9A1
              type: refund.created
              createdAt: '2026-11-28T07:40:00Z'
              merchant: skywood
              data:
                refund: { id: rfd_3k9, orderId: ord_7Qx2, amount: 1450000, currency: TZS, status: pending }
      responses:
        '200': { description: Acknowledged }
  settlementEvent:
    post:
      summary: Settlement events (settlement.ready, settlement.reconciled, settlement.disputed)
      parameters:
        - $ref: '#/components/parameters/HubSignature'
        - { name: X-Hub-Event, in: header, required: true, schema: { $ref: '#/components/schemas/EventType' } }
        - { name: X-Hub-Delivery, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Event' }
      responses:
        '200': { description: Acknowledged }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from POST /oauth/token. ES256, 10 minutes, no refresh token. Scopes are carried in the token.
    clientBasic:
      type: http
      scheme: basic
      description: client_id:client_secret, only on /oauth/token.
    oauth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: /oauth/token
          scopes:
            catalog:read: Read merchants, categories, products, delivery regions
            orders:read: Read orders, refunds, invoices, events
            orders:write: Create quotes and orders, cancel orders
            payments:write: Confirm payments and settlement remittances (signed)
            refunds:write: Confirm refunds (signed)
            settlements:read: Read settlements and lines
            webhooks:manage: Manage webhook endpoints and deliveries
    mutualTLS:
      type: mutualTLS
      description: Optional per partner in live.

  parameters:
    Merchant:
      name: merchant
      in: path
      required: true
      schema: { $ref: '#/components/schemas/MerchantKey' }
    OrderId:
      name: orderId
      in: path
      required: true
      schema: { type: string, maxLength: 40 }
    RefundId:
      name: refundId
      in: path
      required: true
      schema: { type: string, maxLength: 40 }
    SettlementId:
      name: settlementId
      in: path
      required: true
      schema: { type: string, maxLength: 40 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string, maxLength: 200 }
    IfNoneMatch:
      name: If-None-Match
      in: header
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Unique per logical request; stored 24 h. Same key + same body replays the original response.
      schema: { type: string, minLength: 8, maxLength: 64, pattern: '^[A-Za-z0-9_-]+$' }
    HubSignature:
      name: X-Hub-Signature
      in: header
      required: true
      description: 't=<unix seconds>,v1=<hex HMAC-SHA256(secret, t + "." + rawBody)>; accepted within 5 minutes of Hub time.'
      schema: { type: string, pattern: '^t=\d{10},v1=[0-9a-f]{64}$' }

  headers:
    ETag:
      schema: { type: string, example: 'W/"p-8f3a1c"' }

  responses:
    Problem:
      description: Error (RFC 7807)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    RateLimited:
      description: Rate limit exceeded
      headers:
        Retry-After: { schema: { type: integer } }
        RateLimit-Limit: { schema: { type: integer } }
        RateLimit-Remaining: { schema: { type: integer } }
        RateLimit-Reset: { schema: { type: integer } }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    MerchantKey:
      type: string
      enum: [mruk, skywood]
    Currency:
      type: string
      const: TZS
    Amount:
      type: integer
      minimum: 0
      description: Integer TZS
    Phone:
      type: string
      pattern: '^\+255[67]\d{8}$'
    NextCursor:
      type: [string, 'null']
    Rail:
      type: string
      enum: [bank_account, wallet, card, other]
      description: wallet (mobile money) only where enabled on the merchant grant after client approval.

    Token:
      type: object
      required: [access_token, token_type, expires_in, scope]
      properties:
        access_token: { type: string }
        token_type: { type: string, const: Bearer }
        expires_in: { type: integer, example: 600 }
        scope: { type: string }

    Merchant:
      type: object
      required: [key, name, legalName, modes, rails, holdMinutes]
      properties:
        key: { $ref: '#/components/schemas/MerchantKey' }
        name: { type: string }
        legalName: { type: string }
        modes:
          type: array
          items: { type: string, enum: [api, mini_store] }
        rails:
          type: array
          items: { $ref: '#/components/schemas/Rail' }
        holdMinutes: { type: integer }
        settlementAccountMasked:
          type: string
          description: Last digits only, for confirmation. Full details are agreed in writing, never via API.
          example: '****4521'

    Category:
      type: object
      required: [id, name, subcategories]
      properties:
        id: { type: string }
        name: { type: string }
        subcategories:
          type: array
          items: { type: string }

    Product:
      type: object
      required: [id, merchant, categoryId, sub, model, name, price, currency, available, images, updatedAt]
      properties:
        id: { type: string, example: sw-sofa-3s-oslo }
        merchant: { $ref: '#/components/schemas/MerchantKey' }
        categoryId: { type: string }
        sub: { type: string }
        model: { type: string }
        name: { type: string }
        description: { type: string }
        price: { $ref: '#/components/schemas/Amount' }
        currency: { $ref: '#/components/schemas/Currency' }
        available: { type: boolean, description: false when hidden or out of stock }
        stockLevel:
          type: string
          enum: [in_stock, low, out_of_stock]
          description: Exact stock counts are not exposed.
        features:
          type: array
          items: { type: string }
        specs:
          type: array
          items:
            type: object
            required: [label, value]
            properties:
              label: { type: string }
              value: { type: string }
        images:
          type: array
          items: { type: string, format: uri }
        video: { type: [string, 'null'], format: uri }
        updatedAt: { type: string, format: date-time }

    DeliveryRegion:
      type: object
      required: [name, fee, currency, eta]
      properties:
        name: { type: string, example: Dar es Salaam }
        fee: { $ref: '#/components/schemas/Amount' }
        freeAbove: { type: [integer, 'null'], description: Subtotal at which delivery is free, if any }
        currency: { $ref: '#/components/schemas/Currency' }
        eta: { type: string, example: 1-2 days }

    Line:
      type: object
      required: [productId, qty]
      additionalProperties: false
      properties:
        productId: { type: string, maxLength: 80 }
        qty: { type: integer, minimum: 1, maximum: 20 }

    QuoteRequest:
      type: object
      required: [merchant, region, lines]
      additionalProperties: false
      properties:
        merchant: { $ref: '#/components/schemas/MerchantKey' }
        region: { type: string, maxLength: 60 }
        lines:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: '#/components/schemas/Line' }

    PricedLine:
      type: object
      required: [productId, name, model, unitPrice, qty, lineTotal]
      properties:
        productId: { type: string }
        name: { type: string }
        model: { type: string }
        unitPrice: { $ref: '#/components/schemas/Amount' }
        qty: { type: integer }
        lineTotal: { $ref: '#/components/schemas/Amount' }

    Quote:
      type: object
      required: [id, merchant, region, items, subtotal, deliveryFee, total, currency, expiresAt]
      properties:
        id: { type: string, description: Opaque quote id (stored server-side, single use) }
        merchant: { $ref: '#/components/schemas/MerchantKey' }
        region: { type: string }
        items:
          type: array
          items: { $ref: '#/components/schemas/PricedLine' }
        subtotal: { $ref: '#/components/schemas/Amount' }
        discount: { $ref: '#/components/schemas/Amount' }
        deliveryFee: { $ref: '#/components/schemas/Amount' }
        total: { $ref: '#/components/schemas/Amount' }
        currency: { $ref: '#/components/schemas/Currency' }
        expiresAt: { type: string, format: date-time }
      example:
        id: qt_8Hk2mP
        merchant: skywood
        region: Dar es Salaam
        items:
          - { productId: sw-sofa-3s-oslo, name: Oslo 3-seater sofa, model: OSL-3S, unitPrice: 1450000, qty: 1, lineTotal: 1450000 }
        subtotal: 1450000
        discount: 0
        deliveryFee: 0
        total: 1450000
        currency: TZS
        expiresAt: '2026-11-27T09:44:00Z'

    Contact:
      type: object
      required: [name, phone]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 2, maxLength: 80 }
        phone: { $ref: '#/components/schemas/Phone' }
        email: { type: string, maxLength: 120, description: Optional; empty string if none }

    Delivery:
      type: object
      required: [region, addressLine]
      additionalProperties: false
      properties:
        region: { type: string, maxLength: 60 }
        addressLine: { type: string, minLength: 3, maxLength: 200 }

    OrderCreate:
      type: object
      required: [quoteId, partnerOrderRef, partnerCustomerRef, contact, delivery, consentAt]
      additionalProperties: false
      properties:
        quoteId: { type: string, maxLength: 40 }
        partnerOrderRef: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$' }
        partnerCustomerRef: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$' }
        contact: { $ref: '#/components/schemas/Contact' }
        delivery: { $ref: '#/components/schemas/Delivery' }
        consentAt:
          type: string
          format: date-time
          description: When the customer accepted the merchant's terms and privacy notice in the partner app (PDPA).

    OrderStatus:
      type: string
      enum: [pending_payment, paid, packed, dispatched, delivered, cancellation_requested, cancelled, expired]

    Order:
      type: object
      required: [id, number, merchant, status, version, partnerOrderRef, items, subtotal, deliveryFee, total, amountDue, currency, createdAt, updatedAt]
      properties:
        id: { type: string }
        number: { type: string, example: SW-20391 }
        merchant: { $ref: '#/components/schemas/MerchantKey' }
        status: { $ref: '#/components/schemas/OrderStatus' }
        version: { type: integer, description: Increases on every change; use to discard stale webhooks }
        partnerOrderRef: { type: string }
        partnerCustomerRef: { type: string }
        items:
          type: array
          items: { $ref: '#/components/schemas/PricedLine' }
        subtotal: { $ref: '#/components/schemas/Amount' }
        discount: { $ref: '#/components/schemas/Amount' }
        deliveryFee: { $ref: '#/components/schemas/Amount' }
        total: { $ref: '#/components/schemas/Amount' }
        amountDue: { $ref: '#/components/schemas/Amount' }
        currency: { $ref: '#/components/schemas/Currency' }
        holdExpiresAt: { type: [string, 'null'], format: date-time }
        invoiceNumber: { type: [string, 'null'], example: INV-SW-2026-00012 }
        delivery: { $ref: '#/components/schemas/Delivery' }
        cancelReason: { type: [string, 'null'] }
        payments:
          type: array
          items: { $ref: '#/components/schemas/Payment' }
        refunds:
          type: array
          items: { $ref: '#/components/schemas/Refund' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      example:
        id: ord_7Qx2
        number: SW-20391
        merchant: skywood
        status: pending_payment
        version: 1
        partnerOrderRef: AZ-ORD-000123
        partnerCustomerRef: CUST-88812
        items:
          - { productId: sw-sofa-3s-oslo, name: Oslo 3-seater sofa, model: OSL-3S, unitPrice: 1450000, qty: 1, lineTotal: 1450000 }
        subtotal: 1450000
        discount: 0
        deliveryFee: 0
        total: 1450000
        amountDue: 1450000
        currency: TZS
        holdExpiresAt: '2026-11-27T10:00:00Z'
        invoiceNumber: INV-SW-2026-00012
        delivery: { region: Dar es Salaam, addressLine: 'Plot 12, Msasani Peninsula' }
        cancelReason: null
        payments: []
        refunds: []
        createdAt: '2026-11-27T09:30:00Z'
        updatedAt: '2026-11-27T09:30:00Z'

    PaymentConfirmation:
      type: object
      required: [amount, currency, partnerTransactionRef, rail, paidAt]
      additionalProperties: false
      properties:
        amount: { $ref: '#/components/schemas/Amount' }
        currency: { $ref: '#/components/schemas/Currency' }
        partnerTransactionRef: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$' }
        rail: { $ref: '#/components/schemas/Rail' }
        paidAt: { type: string, format: date-time }

    Payment:
      type: object
      required: [id, orderId, amount, currency, status, partnerTransactionRef, rail, paidAt]
      properties:
        id: { type: string }
        orderId: { type: string }
        amount: { $ref: '#/components/schemas/Amount' }
        currency: { $ref: '#/components/schemas/Currency' }
        status: { type: string, enum: [captured, refunded] }
        partnerTransactionRef: { type: string }
        rail: { $ref: '#/components/schemas/Rail' }
        paidAt: { type: string, format: date-time }
        orderStatus: { $ref: '#/components/schemas/OrderStatus' }

    RefundStatus:
      type: string
      enum: [pending, confirmed, failed]

    Refund:
      type: object
      required: [id, orderId, orderNumber, merchant, amount, currency, status, reason, createdAt]
      properties:
        id: { type: string }
        orderId: { type: string }
        orderNumber: { type: string }
        merchant: { $ref: '#/components/schemas/MerchantKey' }
        amount: { $ref: '#/components/schemas/Amount' }
        currency: { $ref: '#/components/schemas/Currency' }
        status: { $ref: '#/components/schemas/RefundStatus' }
        reason: { type: string }
        partnerRefundRef: { type: [string, 'null'] }
        confirmedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }

    RefundConfirmation:
      type: object
      required: [outcome, amount, currency, partnerRefundRef, refundedAt]
      additionalProperties: false
      properties:
        outcome: { type: string, enum: [confirmed, failed] }
        amount: { $ref: '#/components/schemas/Amount' }
        currency: { $ref: '#/components/schemas/Currency' }
        partnerRefundRef: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$' }
        refundedAt: { type: string, format: date-time }
        failureReason: { type: string, maxLength: 300 }

    SettlementStatus:
      type: string
      enum: [open, ready, remitted, reconciled, disputed]

    Settlement:
      type: object
      required: [id, merchant, periodStart, periodEnd, gross, refunds, fees, net, currency, status]
      properties:
        id: { type: string }
        merchant: { $ref: '#/components/schemas/MerchantKey' }
        periodStart: { type: string, format: date-time }
        periodEnd: { type: string, format: date-time }
        gross: { $ref: '#/components/schemas/Amount' }
        refunds: { $ref: '#/components/schemas/Amount' }
        fees: { type: integer, description: Per agreed terms (to be agreed); 0 until set }
        net: { type: integer, description: gross - refunds - fees (TZS) }
        currency: { $ref: '#/components/schemas/Currency' }
        status: { $ref: '#/components/schemas/SettlementStatus' }
        bankReference: { type: [string, 'null'] }
        remittedAt: { type: [string, 'null'], format: date-time }

    SettlementLine:
      type: object
      required: [kind, orderId, orderNumber, reference, amount, currency, at]
      properties:
        kind: { type: string, enum: [payment, refund, fee] }
        orderId: { type: string }
        orderNumber: { type: string }
        reference: { type: string }
        amount: { type: integer, description: Signed TZS (refunds and fees negative) }
        currency: { $ref: '#/components/schemas/Currency' }
        at: { type: string, format: date-time }

    Remittance:
      type: object
      required: [amount, currency, bankReference, paidAt]
      additionalProperties: false
      properties:
        amount: { type: integer, description: Must equal settlement net }
        currency: { $ref: '#/components/schemas/Currency' }
        bankReference: { type: string, maxLength: 64 }
        paidAt: { type: string, format: date-time }

    EventType:
      type: string
      enum:
        - order.created
        - order.paid
        - order.packed
        - order.dispatched
        - order.delivered
        - order.cancellation_requested
        - order.cancelled
        - order.expired
        - refund.created
        - refund.confirmed
        - refund.failed
        - settlement.ready
        - settlement.reconciled
        - settlement.disputed
        - ping

    Event:
      type: object
      required: [id, type, createdAt, data]
      properties:
        id: { type: string }
        type: { $ref: '#/components/schemas/EventType' }
        createdAt: { type: string, format: date-time }
        merchant: { $ref: '#/components/schemas/MerchantKey' }
        data:
          type: object
          description: Snapshot of the affected object (order, refund or settlement). No data beyond what the API returns.
          properties:
            order: { type: object }
            refund: { $ref: '#/components/schemas/Refund' }
            settlement: { $ref: '#/components/schemas/Settlement' }

    WebhookEndpointInput:
      type: object
      required: [url, events]
      additionalProperties: false
      properties:
        url: { type: string, format: uri, pattern: '^https://' }
        events:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/EventType' }

    WebhookEndpoint:
      type: object
      required: [id, url, events, status]
      properties:
        id: { type: string }
        url: { type: string, format: uri }
        events:
          type: array
          items: { $ref: '#/components/schemas/EventType' }
        status: { type: string, enum: [active, disabled] }
        failingSince: { type: [string, 'null'], format: date-time }

    WebhookDelivery:
      type: object
      required: [id, endpointId, eventId, eventType, attempts, createdAt]
      properties:
        id: { type: string }
        endpointId: { type: string }
        eventId: { type: string }
        eventType: { $ref: '#/components/schemas/EventType' }
        attempts: { type: integer }
        lastStatus: { type: [integer, 'null'] }
        nextAttemptAt: { type: [string, 'null'], format: date-time }
        deliveredAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }

    Problem:
      type: object
      required: [type, title, status, code, requestId]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        code:
          type: string
          enum:
            - invalid_request
            - invalid_client
            - invalid_token
            - insufficient_scope
            - invalid_signature
            - signature_expired
            - merchant_not_found
            - product_not_found
            - order_not_found
            - refund_not_found
            - settlement_not_found
            - idempotency_mismatch
            - idempotency_in_progress
            - quote_expired
            - quote_stale
            - out_of_stock
            - region_not_served
            - order_expired
            - order_not_payable
            - order_not_cancellable
            - amount_mismatch
            - currency_mismatch
            - duplicate_partner_reference
            - rail_not_enabled
            - rate_limited
            - hold_limit
            - internal_error
        detail: { type: string }
        instance: { type: string }
        requestId: { type: string }
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }
      example:
        type: https://partners.hub-domain.example/problems/amount_mismatch
        title: Amount does not match amount due
        status: 422
        code: amount_mismatch
        detail: Expected 1450000 TZS.
        instance: /api/partner/v1/orders/ord_7Qx2/payments
        requestId: req_01JDX4Q8
        errors: []
