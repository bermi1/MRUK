# Local development services. `pnpm db:up` starts the database.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: bt
      POSTGRES_PASSWORD: bt
      POSTGRES_DB: bt_commerce
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bt"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
